name: Compatibility

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/compatibility-node.yml@18f741c4161171e7c415075f9feb31f3a0f992d4 # v8.20.1
    with:
      node-versions: '["22","24","26"]'
