# aube writes its own lockfile format when none is present, and Renovate's npm
# manager does not read it. This keeps a regenerated lockfile on the format
# that both sides can update.
defaultLockfileFormat: pnpm

# Resolve only versions published at least a day ago, both in aube and in the
# pnpm that Renovate runs, and fail instead of falling back to a newer one.
minimumReleaseAge: 1440  # 1 day
minimumReleaseAgeStrict: true

packages:
  - examples/agent

# Overrides live here (not package.json "overrides") because both toolchains
# read this file: Renovate updates the lockfile with upstream pnpm, which
# ignores npm-style top-level "overrides", while local/CI installs use aube.
overrides:
  'fast-uri': '>=4.1.4'
